name: Publish

# Cutting a GitHub release publishes the package. There is no npm token in
# this repository: npm's trusted publishing exchanges the workflow's OIDC
# token for the right to publish, which is why `id-token: write` is here and
# why the job installs a current npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: The tag names the version being published
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(node -p "require('./packages/panelwind/package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match packages/panelwind version $version." >&2
            exit 1
          fi

      # A version already on the registry is not an error worth failing a
      # release over: the first publish of a new package has to happen before
      # trusted publishing can be configured for it, so the tag can arrive
      # second. Everything after that publishes here.
      - name: Is this version already published?
        id: published
        run: |
          version="$(node -p "require('./packages/panelwind/package.json').version")"
          if npm view "panelwind@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "panelwind@$version is already on the registry; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm install -g npm@latest
        if: steps.published.outputs.already == 'false'
      - run: npm ci
        if: steps.published.outputs.already == 'false'
      - run: npm run build
        if: steps.published.outputs.already == 'false'
      - run: npm test
        if: steps.published.outputs.already == 'false'
      - run: npm publish --provenance --access public
        if: steps.published.outputs.already == 'false'
        working-directory: packages/panelwind
